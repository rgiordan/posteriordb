[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "posteriordb_jax"
version = "0.1.0"
description = "JAX/TensorFlow Probability translations of posteriordb Stan models, with a Stan-comparison testing framework."
requires-python = ">=3.10"
dependencies = [
    "jax",
    "numpy",
    "paragami",
    "modelgami",
]

[project.optional-dependencies]
# The original translations in posteriordb_jax.models use TensorFlow Probability
# (which needs jax <= 0.5); the catalog of modelgami models needs neither.
legacy = ["tensorflow-probability"]
stan = ["bridgestan"]
# The ready-made MCMC analyses of posteriordb_jax.batch.
mcmc = ["blackjax"]
test = ["pytest", "tensorflow-probability", "bridgestan"]

[tool.setuptools.packages.find]
include = ["posteriordb_jax*"]

[tool.pytest.ini_options]
markers = ["stan: compiles a Stan model with BridgeStan (slow; deselect with -m 'not stan')"]
