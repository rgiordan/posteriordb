[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "posteriordb_jax"
version = "0.1.0"
description = "JAX/TensorFlow Probability translations of posteriordb Stan models, with a Stan-comparison testing framework."
requires-python = ">=3.10"
dependencies = [
    "jax",
    "tensorflow-probability",
    "bridgestan",
    "numpy",
    "paragami",
    "modelgami",
]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["posteriordb_jax*"]

[tool.pytest.ini_options]
markers = ["stan: compiles a Stan model with BridgeStan (slow; deselect with -m 'not stan')"]
